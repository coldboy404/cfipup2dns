<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cfipup2dns WebUI</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --panel: rgba(255,255,255,.72);
      --panel-2: rgba(255,255,255,.88);
      --text: #24324a;
      --muted: #6f7f98;
      --line: rgba(122, 142, 179, .18);
      --primary: #6f9df6;
      --primary-2: #8fb4ff;
      --warn: #f3a85b;
      --shadow: 0 16px 40px rgba(104, 132, 180, .16);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #fffdfc 0%, #f7f9ff 38%, #eef4ff 100%);
      color: var(--text);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 32px; }
    .hero { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 16px; }
    .hero h1 { margin: 0 0 6px; font-size: 30px; }
    .hero p { margin: 0; color: var(--muted); }
    .hero a { color: #76a7ff; text-decoration: none; }
    .badge-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .stack { display: grid; gap: 16px; }
    .card { background: linear-gradient(135deg, rgba(255,255,255,.92) 0%, rgba(245,248,255,.88) 52%, rgba(237,244,255,.84) 100%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card h3 { margin: 0 0 14px; font-size: 18px; }
    .fields { display: grid; gap: 14px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, select, button { width: 100%; border-radius: 12px; border: 1px solid var(--line); outline: none; background: var(--panel-2); color: var(--text); padding: 12px 14px; font-size: 14px; }
    button { background: linear-gradient(135deg, var(--primary), var(--primary-2)); border: none; font-weight: 700; cursor: pointer; color: #fff; }
    button.secondary { background: rgba(255,255,255,.72); border: 1px solid var(--line); color: var(--text); }
    button.warn { background: linear-gradient(135deg, #eea867, #f5bb7a); color: #fff; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--panel-2); border-radius: 12px; border: 1px solid var(--line); }
    .switch input { width: 18px; height: 18px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar > * { flex: 1; min-width: 140px; }
    .status { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.66); color: var(--muted); font-size: 13px; border: 1px solid var(--line); }
    .hint { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.66); color: var(--muted); font-size: 13px; border: 1px solid var(--line); line-height: 1.7; }
    .ip-list { display: grid; gap: 10px; }
    .ip-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,.64); }
    .ip-main { margin-bottom: 8px; }
    .ip-main code { color: #2e3f5d; font-size: 15px; }
    .ip-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { border-radius: 999px; padding: 4px 8px; font-size: 12px; background: rgba(111,157,246,.10); color: #4b6288; border: 1px solid rgba(111,157,246,.16); }
    pre { margin: 0; min-height: 180px; background: rgba(247,250,255,.92); color: #35506d; border-radius: 14px; padding: 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; border: 1px solid rgba(122, 142, 179, .18); }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .row-2, .row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>cfipup2dns 控制台</h1>
        <p>作者：coldboy404</p>
        <p><a href="https://github.com/coldboy404/cfipup2dns" target="_blank" rel="noopener noreferrer">项目地址：https://github.com/coldboy404/cfipup2dns</a></p>
      </div>
      <div class="badge-row">
        <div class="badge">WebUI</div>
        <div class="badge">Docker</div>
        <div class="badge">Cloudflare DNS</div>
        <div class="badge">9527</div>
      </div>
    </div>

    <div class="grid">
      <div class="stack">
        <div class="card">
          <h3>Cloudflare 配置</h3>
          <div class="fields">
            <div>
              <label for="token">API Token</label>
              <input id="token" type="password" value="{{CF_TOKEN}}" />
            </div>
            <div class="row-2">
              <div>
                <label for="zoneId">Zone ID</label>
                <input id="zoneId" value="{{CF_ZONE_ID}}" />
              </div>
              <div>
                <label for="domain">域名</label>
                <input id="domain" value="{{CF_DOMAIN}}" />
              </div>
            </div>
            <div class="row-2">
              <div>
                <label for="ttl">TTL</label>
                <input id="ttl" type="number" min="1" max="86400" value="{{CF_TTL}}" />
              </div>
              <div>
                <label>&nbsp;</label>
                <div class="switch">
                  <span>代理</span>
                  <input id="proxied" type="checkbox" {{CF_PROXIED_CHECKED}} />
                </div>
              </div>
            </div>
            <div class="toolbar">
              <button onclick="saveConfig()">保存</button>
              <button class="secondary" onclick="reloadConfig()">读取</button>
              <button class="secondary" onclick="toggleToken()">显示 / 隐藏 Token</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>立即执行</h3>
          <div class="row-3">
            <div>
              <label for="ipMode">IP 模式</label>
              <select id="ipMode">
                <option value="both">IPv4 / IPv6</option>
                <option value="4">IPv4</option>
                <option value="6">IPv6</option>
              </select>
            </div>
            <div>
              <label for="topN">优选数量</label>
              <input id="topN" type="number" min="1" value="5" />
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="warn" onclick="runNow()">立即运行</button>
            </div>
          </div>
          <div class="status" id="runState">空闲</div>
          <div style="height:12px"></div>
          <div class="ip-list" id="bestIps"><div class="status">暂无优选 IP</div></div>
        </div>

        <div class="card">
          <h3>定时任务</h3>
          <div class="fields">
            <div class="switch">
              <span>启用计划任务</span>
              <input id="scheduleEnabled" type="checkbox" {{SCHEDULE_ENABLED_CHECKED}} />
            </div>
            <div class="row-3">
              <div>
                <label for="scheduleInterval">每隔几小时</label>
                <input id="scheduleInterval" type="number" min="1" max="24" value="{{SCHEDULE_INTERVAL}}" />
              </div>
              <div>
                <label for="scheduleMode">IP 模式</label>
                <select id="scheduleMode">
                  <option value="both" {{SCHEDULE_MODE_BOTH}}>IPv4 / IPv6</option>
                  <option value="4" {{SCHEDULE_MODE_4}}>IPv4</option>
                  <option value="6" {{SCHEDULE_MODE_6}}>IPv6</option>
                </select>
              </div>
              <div>
                <label for="scheduleTopN">优选数量</label>
                <input id="scheduleTopN" type="number" min="1" max="50" value="{{SCHEDULE_TOPN}}" />
              </div>
            </div>
            <div class="switch">
              <span>开机后自动跑</span>
              <input id="scheduleReboot" type="checkbox" {{SCHEDULE_REBOOT_CHECKED}} />
            </div>
            <div class="toolbar">
              <button onclick="saveSimpleSchedule()">保存</button>
              <button class="secondary" onclick="reloadSchedule()">读取</button>
            </div>
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <h3>运行日志</h3>
          <div class="toolbar">
            <button class="secondary" onclick="loadLogs(true)">刷新</button>
            <button class="secondary" onclick="clearLogs()">清空日志</button>
          </div>
          <pre id="logs">加载中...</pre>
        </div>
      </div>
    </div>
  </div>

<script>
let isLogsFocused = false;

function collectConfig() {
  return {
    token: document.getElementById('token').value.trim(),
    zone_id: document.getElementById('zoneId').value.trim(),
    domain: document.getElementById('domain').value.trim(),
    ttl: Number(document.getElementById('ttl').value || 60),
    proxied: document.getElementById('proxied').checked,
  };
}

function applyForm(form) {
  document.getElementById('token').value = form.token || '';
  document.getElementById('zoneId').value = form.zone_id || '';
  document.getElementById('domain').value = form.domain || '';
  document.getElementById('ttl').value = form.ttl || 60;
  document.getElementById('proxied').checked = !!form.proxied;
}

function applySchedule(schedule) {
  document.getElementById('scheduleEnabled').checked = !!schedule.enabled;
  document.getElementById('scheduleInterval').value = schedule.interval_hours || 6;
  document.getElementById('scheduleMode').value = schedule.ip_mode || 'both';
  document.getElementById('scheduleTopN').value = schedule.top_n || 3;
  document.getElementById('scheduleReboot').checked = !!schedule.reboot;
}

async function saveConfig() {
  const payload = collectConfig();
  if (!payload.token || !payload.zone_id || !payload.domain) return alert('必填项不能为空');
  const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
  const j = await r.json();
  if (!j.ok) return alert('保存失败');
  applyForm(j.form || payload);
  alert('已保存');
}

async function reloadConfig() {
  const r = await fetch('/api/config');
  const j = await r.json();
  if (!j.ok) return alert('读取失败');
  applyForm(j.form || {});
}

async function reloadSchedule() {
  const r = await fetch('/api/schedule');
  const j = await r.json();
  if (!j.ok) return alert('读取失败');
  applySchedule(j.schedule || {});
}

function toggleToken() {
  const el = document.getElementById('token');
  el.type = el.type === 'password' ? 'text' : 'password';
}

function formatNumber(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (Number.isNaN(n)) return '';
  return String(Math.round(n));
}

function formatDateTime(v) {
  if (!v) return '--';
  const d = new Date(Number(v) * 1000);
  if (Number.isNaN(d.getTime())) return '--';
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}-${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderBestIpsMeta(updatedAt, nextRunAt) {
  document.getElementById('bestIpsMeta').innerHTML = `优选 IP 时间：${formatDateTime(updatedAt)}<br>下次运行时间：${formatDateTime(nextRunAt)}`;
}

function renderBestIps(items) {
  const root = document.getElementById('bestIps');
  if (!items || !items.length) {
    root.innerHTML = '<div class="status">暂无优选 IP</div>';
    return;
  }
  root.innerHTML = items.map(item => {
    const speed = Number(item.download_mbps || 0);
    const latency = item.latency_ms;
    const tags = [
      `<span class="tag">IPv${item.version}</span>`,
      speed > 0 ? `<span class="tag">下载 ${formatNumber(speed)} Mbps</span>` : `<span class="tag">下载未测出</span>`,
      latency !== null && latency !== undefined && latency !== '' ? `<span class="tag">延迟 ${formatNumber(latency)} ms</span>` : `<span class="tag">延迟未测出</span>`,
    ].filter(Boolean).join('');
    return `<div class="ip-item"><div class="ip-main"><code>${item.ip}</code></div><div class="ip-tags">${tags}</div></div>`;
  }).join('');
}

async function loadBestIps() {
  const r = await fetch('/api/best-ips');
  const j = await r.json();
  renderBestIps(j.result || []);
}

async function runNow() {
  const ip_mode = document.getElementById('ipMode').value;
  const top_n = Number(document.getElementById('topN').value || 5);
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ip_mode, top_n})
  });
  const j = await r.json();
  document.getElementById('runState').textContent = j.running ? '运行中' : '已有任务在运行';
  setTimeout(() => { loadStatus(); loadBestIps(); }, 1000);
}

async function saveSimpleSchedule() {
  const payload = {
    enabled: document.getElementById('scheduleEnabled').checked,
    interval_hours: Number(document.getElementById('scheduleInterval').value || 6),
    reboot: document.getElementById('scheduleReboot').checked,
    ip_mode: document.getElementById('scheduleMode').value,
    top_n: Number(document.getElementById('scheduleTopN').value || 3),
  };
  const r = await fetch('/api/schedule', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) return alert('保存失败');
  applySchedule(j.schedule || {});
  alert('已保存');
}

async function loadLogs(force = false) {
  if (isLogsFocused && !force) return;
  const r = await fetch('/api/logs');
  const j = await r.json();
  const el = document.getElementById('logs');
  const shouldStickBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.textContent = j.logs || '';
  if (shouldStickBottom) el.scrollTop = el.scrollHeight;
}

async function clearLogs() {
  const ok = confirm('确定要清除当前日志吗？');
  if (!ok) return;
  const r = await fetch('/api/logs/clear', { method: 'POST' });
  const j = await r.json();
  if (!j.ok) return alert('清除失败');
  await loadLogs(true);
}

async function loadStatus() {
  const r = await fetch('/api/status');
  const j = await r.json();
  const state = j.running ? '运行中' : ('空闲' + (j.code === null ? '' : ` / 退出码 ${j.code}`));
  document.getElementById('runState').textContent = state;
  if (j.selected_ips && j.selected_ips.length) {
    renderBestIps(j.selected_ips);
  }
}

function bindLogEvents() {
  const el = document.getElementById('logs');
  el.addEventListener('mouseenter', () => { isLogsFocused = true; });
  el.addEventListener('mouseleave', () => { isLogsFocused = false; });
  el.addEventListener('focusin', () => { isLogsFocused = true; });
  el.addEventListener('focusout', () => { isLogsFocused = false; });
}

reloadConfig();
reloadSchedule();
loadStatus();
loadBestIps();
loadLogs(true);
bindLogEvents();
setInterval(() => { loadStatus(); loadBestIps(); }, 3000);
setInterval(() => { loadLogs(false); }, 3000);
</script>
</body>
</html>
