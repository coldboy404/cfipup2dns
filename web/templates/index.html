<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cfipup2dns WebUI</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121932;
      --panel-2: #182243;
      --text: #eaf1ff;
      --muted: #9fb0d3;
      --line: rgba(255,255,255,.08);
      --primary: #4f8cff;
      --primary-2: #76a7ff;
      --warn: #ffb020;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1b2752 0%, var(--bg) 48%);
      color: var(--text);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 32px; }
    .hero {
      display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 30px; }
    .hero p { margin: 0; color: var(--muted); }
    .hero a { color: #76a7ff; text-decoration: none; }
    .badge-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: var(--muted); font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
    }
    .stack { display: grid; gap: 16px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card h3 { margin: 0 0 14px; font-size: 18px; }
    .fields { display: grid; gap: 14px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea, button {
      width: 100%; border-radius: 12px; border: 1px solid var(--line); outline: none;
      background: var(--panel-2); color: var(--text); padding: 12px 14px; font-size: 14px;
    }
    textarea { min-height: 132px; resize: vertical; }
    button {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border: none; font-weight: 700; cursor: pointer;
    }
    button.secondary { background: rgba(255,255,255,.06); border: 1px solid var(--line); }
    button.warn { background: linear-gradient(135deg, #ff9f43, #ffb347); }
    .switch {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--panel-2); border-radius: 12px; border: 1px solid var(--line);
    }
    .switch input { width: 18px; height: 18px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar > * { flex: 1; min-width: 140px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .day {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); color: var(--text);
    }
    .day input { width: 16px; height: 16px; }
    pre {
      margin: 0; min-height: 180px; background: #0a0f1f; color: #c6ffd9; border-radius: 14px; padding: 14px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      border: 1px solid rgba(255,255,255,.06);
    }
    .status {
      padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); color: var(--muted); font-size: 13px; border: 1px solid var(--line);
    }
    details summary { cursor: pointer; color: var(--muted); margin-bottom: 10px; }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .row-2, .row-3, .weekdays { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>cfipup2dns 控制台</h1>
        <p>作者：coldboy404</p>
        <p><a href="https://github.com/coldboy404/cfipup2dns" target="_blank" rel="noopener noreferrer">项目地址：https://github.com/coldboy404/cfipup2dns</a></p>
      </div>
      <div class="badge-row">
        <div class="badge">WebUI</div>
        <div class="badge">Docker</div>
        <div class="badge">Cloudflare DNS</div>
        <div class="badge">9527</div>
      </div>
    </div>

    <div class="grid">
      <div class="stack">
        <div class="card">
          <h3>Cloudflare 配置</h3>
          <div class="fields">
            <div>
              <label for="token">API Token</label>
              <input id="token" type="password" value="{{CF_TOKEN}}" />
            </div>
            <div class="row-2">
              <div>
                <label for="zoneId">Zone ID</label>
                <input id="zoneId" value="{{CF_ZONE_ID}}" />
              </div>
              <div>
                <label for="domain">域名</label>
                <input id="domain" value="{{CF_DOMAIN}}" />
              </div>
            </div>
            <div class="row-2">
              <div>
                <label for="ttl">TTL</label>
                <input id="ttl" type="number" min="1" max="86400" value="{{CF_TTL}}" />
              </div>
              <div>
                <label>&nbsp;</label>
                <div class="switch">
                  <span>代理</span>
                  <input id="proxied" type="checkbox" {{CF_PROXIED_CHECKED}} />
                </div>
              </div>
            </div>
            <div class="toolbar">
              <button onclick="saveConfig()">保存</button>
              <button class="secondary" onclick="reloadConfig()">读取</button>
              <button class="secondary" onclick="toggleToken()">显示 / 隐藏 Token</button>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>立即执行</h3>
          <div class="row-3">
            <div>
              <label for="ipMode">IP 模式</label>
              <select id="ipMode">
                <option value="both">both</option>
                <option value="4">4</option>
                <option value="6">6</option>
              </select>
            </div>
            <div>
              <label for="topN">TOP_N</label>
              <input id="topN" type="number" min="1" value="5" />
            </div>
            <div>
              <label>&nbsp;</label>
              <button class="warn" onclick="runNow()">立即运行</button>
            </div>
          </div>
          <div class="status" id="runState">空闲</div>
          <pre id="runOutput">等待执行...</pre>
        </div>

        <div class="card">
          <h3>定时任务</h3>
          <div class="fields">
            <div class="switch">
              <span>启用每日计划</span>
              <input id="scheduleEnabled" type="checkbox" {{SCHEDULE_ENABLED_CHECKED}} />
            </div>
            <div class="row-3">
              <div>
                <label for="scheduleTime">每天几点</label>
                <input id="scheduleTime" type="time" value="{{SCHEDULE_TIME}}" />
              </div>
              <div>
                <label for="scheduleMode">IP 模式</label>
                <select id="scheduleMode">
                  <option value="both" {{SCHEDULE_MODE_BOTH}}>both</option>
                  <option value="4" {{SCHEDULE_MODE_4}}>4</option>
                  <option value="6" {{SCHEDULE_MODE_6}}>6</option>
                </select>
              </div>
              <div>
                <label for="scheduleTopN">TOP_N</label>
                <input id="scheduleTopN" type="number" min="1" max="50" value="{{SCHEDULE_TOPN}}" />
              </div>
            </div>
            <div>
              <label>每周几</label>
              <div class="weekdays">
                <label class="day"><input type="checkbox" value="1" class="weekday" {{WD_MON_CHECKED}} />一</label>
                <label class="day"><input type="checkbox" value="2" class="weekday" {{WD_TUE_CHECKED}} />二</label>
                <label class="day"><input type="checkbox" value="3" class="weekday" {{WD_WED_CHECKED}} />三</label>
                <label class="day"><input type="checkbox" value="4" class="weekday" {{WD_THU_CHECKED}} />四</label>
                <label class="day"><input type="checkbox" value="5" class="weekday" {{WD_FRI_CHECKED}} />五</label>
                <label class="day"><input type="checkbox" value="6" class="weekday" {{WD_SAT_CHECKED}} />六</label>
                <label class="day"><input type="checkbox" value="0" class="weekday" {{WD_SUN_CHECKED}} />日</label>
              </div>
            </div>
            <div class="switch">
              <span>开机后自动跑</span>
              <input id="scheduleReboot" type="checkbox" {{SCHEDULE_REBOOT_CHECKED}} />
            </div>
            <div class="toolbar">
              <button onclick="saveSimpleSchedule()">保存</button>
              <button class="secondary" onclick="reloadSchedule()">读取</button>
            </div>
            <details>
              <summary>高级模式</summary>
              <textarea id="cron">{{CRON_TEXT}}</textarea>
              <div class="toolbar">
                <button class="secondary" onclick="saveCron()">保存原始计划</button>
                <button class="secondary" onclick="setRecommendedCron()">恢复默认</button>
              </div>
            </details>
          </div>
        </div>
      </div>

      <div class="stack">
        <div class="card">
          <h3>运行日志</h3>
          <div class="toolbar">
            <button class="secondary" onclick="refreshAll()">刷新</button>
          </div>
          <pre id="logs">加载中...</pre>
        </div>
      </div>
    </div>
  </div>

<script>
function collectConfig() {
  return {
    token: document.getElementById('token').value.trim(),
    zone_id: document.getElementById('zoneId').value.trim(),
    domain: document.getElementById('domain').value.trim(),
    ttl: Number(document.getElementById('ttl').value || 60),
    proxied: document.getElementById('proxied').checked,
  };
}

function applyForm(form) {
  document.getElementById('token').value = form.token || '';
  document.getElementById('zoneId').value = form.zone_id || '';
  document.getElementById('domain').value = form.domain || '';
  document.getElementById('ttl').value = form.ttl || 60;
  document.getElementById('proxied').checked = !!form.proxied;
}

function applySchedule(schedule, raw) {
  document.getElementById('scheduleEnabled').checked = !!schedule.enabled;
  document.getElementById('scheduleTime').value = schedule.time || '02:00';
  document.getElementById('scheduleMode').value = schedule.ip_mode || 'both';
  document.getElementById('scheduleTopN').value = schedule.top_n || 5;
  document.getElementById('scheduleReboot').checked = !!schedule.reboot;
  document.querySelectorAll('.weekday').forEach(el => {
    el.checked = (schedule.weekdays || []).includes(Number(el.value));
  });
  document.getElementById('cron').value = raw || '';
}

function getWeekdays() {
  return Array.from(document.querySelectorAll('.weekday:checked')).map(el => Number(el.value)).sort((a, b) => a - b);
}

async function saveConfig() {
  const payload = collectConfig();
  if (!payload.token || !payload.zone_id || !payload.domain) return alert('必填项不能为空');
  const r = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) return alert('保存失败');
  applyForm(j.form || payload);
  alert('已保存');
}

async function reloadConfig() {
  const r = await fetch('/api/config');
  const j = await r.json();
  if (!j.ok) return alert('读取失败');
  applyForm(j.form || {});
}

async function reloadSchedule() {
  const r = await fetch('/api/schedule');
  const j = await r.json();
  if (!j.ok) return alert('读取失败');
  applySchedule(j.schedule || {}, j.raw || '');
}

function toggleToken() {
  const el = document.getElementById('token');
  el.type = el.type === 'password' ? 'text' : 'password';
}

async function runNow() {
  const ip_mode = document.getElementById('ipMode').value;
  const top_n = Number(document.getElementById('topN').value || 5);
  const r = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ip_mode, top_n})
  });
  const j = await r.json();
  document.getElementById('runState').textContent = j.running ? '运行中' : '已有任务在运行';
  setTimeout(refreshAll, 1000);
}

async function saveSimpleSchedule() {
  const payload = {
    enabled: document.getElementById('scheduleEnabled').checked,
    time: document.getElementById('scheduleTime').value || '02:00',
    weekdays: getWeekdays(),
    reboot: document.getElementById('scheduleReboot').checked,
    ip_mode: document.getElementById('scheduleMode').value,
    top_n: Number(document.getElementById('scheduleTopN').value || 5),
  };
  const r = await fetch('/api/schedule', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) return alert('保存失败');
  applySchedule(j.schedule || {}, j.raw || '');
  alert('已保存');
}

async function loadLogs() {
  const r = await fetch('/api/logs');
  const j = await r.json();
  document.getElementById('logs').textContent = j.logs || '';
}

async function loadStatus() {
  const r = await fetch('/api/status');
  const j = await r.json();
  const state = j.running ? '运行中' : ('空闲' + (j.code === null ? '' : ` / 退出码 ${j.code}`));
  document.getElementById('runState').textContent = state;
  document.getElementById('runOutput').textContent = (j.stdout || '') + ((j.stderr || '') ? ('\n' + j.stderr) : '');
}

async function saveCron() {
  const content = document.getElementById('cron').value;
  const r = await fetch('/api/cron', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({content})
  });
  const j = await r.json();
  if (!j.ok) return alert('保存失败');
  applySchedule(j.schedule || {}, j.raw || content);
  alert('已保存');
}

function setRecommendedCron() {
  document.getElementById('cron').value = `SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n0 2 * * * IP_MODE=both TOP_N=5 /opt/cfipup2dns/cfip.sh >> /data/logs/cron.log 2>&1\n@reboot sleep 30 && IP_MODE=both TOP_N=5 /opt/cfipup2dns/cfip.sh >> /data/logs/boot.log 2>&1\n`;
}

async function refreshAll() {
  await Promise.all([loadStatus(), loadLogs()]);
}

reloadConfig();
reloadSchedule();
refreshAll();
setInterval(loadStatus, 3000);
</script>
</body>
</html>
