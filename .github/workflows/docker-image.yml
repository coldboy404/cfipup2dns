name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python and shell files
        run: |
          python3 -m py_compile cfip_runner.py web/app.py docker/sync_cidr.py
          python3 -m unittest discover -s tests -v
          for file in cfip.sh docker/*.sh install.sh uninstall.sh menu.sh; do
            sh -n "$file"
          done

      - name: Validate Compose file
        run: docker compose config --quiet

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native image for runtime verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cfipup2dns:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke
      - name: Verify initialization, health, and HTTP authentication
        run: |
          docker run -d --name smoke -p 127.0.0.1:9527:9527 -e WEB_USERNAME=ci -e WEB_PASSWORD=ci-smoke-only cfipup2dns:smoke
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9527/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9527/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9527/api/config)" = 401
          curl -fsS -u ci:ci-smoke-only http://127.0.0.1:9527/api/config > /dev/null
          docker exec smoke test -x /data/project/montecarlo-ip-searcher
          test "$(docker exec smoke stat -c %a /data/project/config.json)" = 600

  build-and-push:
    needs: [validate, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cfipup2dns
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cfipup2dns
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
