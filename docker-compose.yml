services:
  cfipup2dns:
    image: ghcr.io/coldboy404/cfipup2dns:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfipup2dns
    restart: unless-stopped
    ports:
      - "${PORT:-9527}:9527"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 9527
      PROJECT_DIR: /data/project
      CONFIG_FILE: /data/project/config.json
      TIMEOUT: ${TIMEOUT:-6s}
      ROUNDS: ${ROUNDS:-6}
      MCIS_HOST: ${MCIS_HOST:-}
      MCIS_PATH: ${MCIS_PATH:-/cdn-cgi/trace}
      HEADS_V4: ${HEADS_V4:-4}
      HEADS_V6: ${HEADS_V6:-16}
      BUDGET_V6: ${BUDGET_V6:-4000}
      CONCURRENCY_V6: ${CONCURRENCY_V6:-100}
      PROBE_FALLBACK_HOST: ${PROBE_FALLBACK_HOST:-example.com}
      PROBE_VALIDATE_TIMEOUT: ${PROBE_VALIDATE_TIMEOUT:-8}
      DOWNLOAD_TOP: ${DOWNLOAD_TOP:-8}
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-90s}
      DOWNLOAD_MODE: ${DOWNLOAD_MODE:-sequential}
      DOWNLOAD_URL: ${DOWNLOAD_URL:-}
      DOWNLOAD_BYTES: ${DOWNLOAD_BYTES:-50000000}
      MIN_DOWNLOAD_MBPS: ${MIN_DOWNLOAD_MBPS:-0}
      MAX_LATENCY_MS: ${MAX_LATENCY_MS:-0}
      MIN_LATENCY_MS: ${MIN_LATENCY_MS:-0}
      MAX_LOSS_RATE: ${MAX_LOSS_RATE:-1}
      CF_COLO: ${CF_COLO:-}
      KEEP_LAST_ON_FAIL: ${KEEP_LAST_ON_FAIL:-true}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-2097152}
      LOG_KEEP_BYTES: ${LOG_KEEP_BYTES:-524288}
      LOG_API_TAIL_LINES: ${LOG_API_TAIL_LINES:-300}
      LOG_MEMORY_MAX_BYTES: ${LOG_MEMORY_MAX_BYTES:-16000}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
