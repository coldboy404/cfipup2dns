services:
  cfipup2dns:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: cfipup2dns
    restart: unless-stopped
    ports:
      - "9527:9527"
    environment:
      TZ: Asia/Shanghai
      PORT: 9527
      PROJECT_DIR: /data/project
      CONFIG_FILE: /data/project/config.json
      GH_PROXY: ${GH_PROXY:-https://gh-proxy.org/}
      MCIS_REF: ${MCIS_REF:-main}
      TIMEOUT: ${TIMEOUT:-6s}
      ROUNDS: ${ROUNDS:-6}
      DOWNLOAD_TOP: ${DOWNLOAD_TOP:-8}
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-90s}
      DOWNLOAD_MODE: ${DOWNLOAD_MODE:-sequential}
      DOWNLOAD_URL: ${DOWNLOAD_URL:-}
      DOWNLOAD_BYTES: ${DOWNLOAD_BYTES:-50000000}
    volumes:
      - ./data:/data
